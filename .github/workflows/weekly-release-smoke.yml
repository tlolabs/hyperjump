name: Weekly tagged-release smoke
on:
  schedule:
    # Sunday 08:17 PST / 09:17 PDT. GitHub schedules may start later.
    - cron: '17 16 * * 0'
permissions:
  contents: read
concurrency:
  group: weekly-tagged-release-smoke
  cancel-in-progress: false
jobs:
  select:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      actions: read
    outputs:
      matrix: ${{ steps.tags.outputs.matrix }}
      has_new: ${{ steps.tags.outputs.has_new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - id: tags
        name: Select and claim new version tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 control/.github/scripts/weekly_release_smoke.py select
          --pattern '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$'
          --baseline-file control/.github/weekly-smoke-baseline.json
          --targets linux-x64,windows-x64 --claim
  smoke:
    name: Smoke ${{ matrix.tag }} (${{ matrix.target }})
    needs: select
    if: github.run_attempt == 1 && needs.select.outputs.has_new == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.target == 'linux-x64' && 'ubuntu-24.04' || matrix.target == 'linux-arm64' && 'ubuntu-24.04-arm' || matrix.target == 'windows-arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source
    env:
      ARCH: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}
      RUST_TARGET: ${{ endsWith(matrix.target, 'arm64') && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Linux native display prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libxkbcommon0
      - name: Install pinned build requirements
        run: python -m pip install -r requirements.txt -r build_requirements.txt
      - name: Build native executable
        run: python -m PyInstaller --noconfirm "Hyper Jump.spec"
      - name: Linux native startup smoke
        if: runner.os == 'Linux'
        timeout-minutes: 2
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 ../control/.github/scripts/launch_smoke.py 'dist/Hyper Jump/Hyper Jump'
      - name: Windows native startup smoke
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: python ../control/.github/scripts/launch_smoke.py 'dist/Hyper Jump/Hyper Jump.exe'
  finalize:
    needs: [select, smoke]
    if: always() && github.run_attempt == 1 && needs.select.outputs.has_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Record each native target outcome
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_MATRIX: ${{ needs.select.outputs.matrix }}
        run: python3 control/.github/scripts/weekly_release_smoke.py finalize --matrix-env SMOKE_MATRIX
