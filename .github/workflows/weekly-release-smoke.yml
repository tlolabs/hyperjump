name: Weekly tagged-release smoke
on:
  schedule:
    # Sunday 08:17 PST / 09:17 PDT. GitHub schedules may start later.
    - cron: '17 16 * * 0'
permissions:
  contents: read
concurrency:
  group: weekly-tagged-release-smoke
  cancel-in-progress: false
jobs:
  select:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      actions: read
    outputs:
      matrix: ${{ steps.tags.outputs.matrix }}
      has_new: ${{ steps.tags.outputs.has_new }}
      release_plan: ${{ steps.tags.outputs.release_plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - id: tags
        name: Wait for matching published Mac release, then claim unseen targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 control/.github/scripts/native_release.py select
          --baseline-file control/.github/weekly-smoke-baseline.json --claim

  smoke:
    name: Smoke ${{ matrix.tag }} (${{ matrix.target }})
    needs: select
    if: github.run_attempt == 1 && needs.select.outputs.has_new == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.target == 'linux-x64' && 'ubuntu-24.04' || 'windows-2025' }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source
    env:
      NATIVE_ITEM: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1 libegl1 libx11-6 libxrandr2 libxi6
      - name: Install supported native wheel dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements.txt -r build_requirements.txt
      - name: Record exact build dependency versions
        run: python -m pip freeze
      - name: Build native executable and complete runtime directory
        run: python -m PyInstaller --noconfirm 'Hyper Jump.spec'
      - id: package
        name: Package the full native distribution
        run: python ../control/.github/scripts/native_package.py package
      - name: Extract and smoke-test Linux release archive
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 ../control/.github/scripts/native_package.py smoke
      - name: Extract and smoke-test Windows release archive
        if: runner.os == 'Windows'
        run: python ../control/.github/scripts/native_package.py smoke
      - name: Transfer only smoke-tested archive and receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: source/release-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish ${{ matrix.tag }} (${{ matrix.target }})
    needs: [select, smoke]
    if: always() && github.run_attempt == 1 && needs.select.result == 'success' && needs.select.outputs.has_new == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      NATIVE_ITEM: ${{ toJSON(matrix) }}
    steps:
      # No release-tag checkout or build-produced code runs with this token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - id: eligible
        name: Verify this exact target's native job passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/.github/scripts/native_release.py eligible
      - name: Download this run's tested artifact
        if: steps.eligible.outputs.passed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.eligible.outputs.artifact_name }}
          path: release-assets
      - name: Attach verified bytes to the unchanged matching Mac release
        if: steps.eligible.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLAN: ${{ needs.select.outputs.release_plan }}
        run: python3 control/.github/scripts/native_release.py publish

  finalize:
    needs: [select, smoke]
    if: always() && github.run_attempt == 1 && needs.select.result == 'success' && needs.select.outputs.has_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_MATRIX: ${{ needs.select.outputs.matrix }}
        run: python3 control/.github/scripts/weekly_release_smoke.py finalize --matrix-env SMOKE_MATRIX
